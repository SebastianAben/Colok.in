name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: colokin
          POSTGRES_PASSWORD: colokin
          POSTGRES_DB: colokin
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U colokin -d colokin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://colokin:colokin@127.0.0.1:15432/colokin?schema=public
      JWT_ACCESS_SECRET: dev_access_secret_change_me
      JWT_REFRESH_SECRET: dev_refresh_secret_change_me
      MQTT_URL: mqtt://127.0.0.1:1883
      IOT_MODE: mock
      FCM_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare API test database
        run: pnpm --filter @colokin/api prisma:migrate:deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate server compose
        run: docker compose --env-file .env.server.prod.example -f docker-compose.server.yml config >/dev/null
