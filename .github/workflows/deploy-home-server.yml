name: Deploy Home Server

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  packages: write

concurrency:
  group: colokin-deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and push API image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select image tags
        id: image
        run: |
          image="ghcr.io/sebastianaben/colokin-api:${GITHUB_SHA}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            target="${{ inputs.environment }}"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            target="prod"
          else
            target="dev"
          fi

          case "$target" in
            dev)
              latest="ghcr.io/sebastianaben/colokin-api:dev-latest"
              ;;
            prod)
              latest="ghcr.io/sebastianaben/colokin-api:prod-latest"
              ;;
            *)
              echo "Unknown image target: $target" >&2
              exit 1
              ;;
          esac

          {
            echo "image=$image"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runner
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy backend
    runs-on: [self-hosted, Linux, X64, docker, colokin]
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select environment
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            target="${{ inputs.environment }}"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            target="prod"
          else
            target="dev"
          fi

          case "$target" in
            dev)
              {
                echo "DEPLOY_ENV=dev"
                echo "DEPLOY_PATH=/home/froztbitez/web-server/colokin/dev"
                echo "ENV_FILE=.env.server.dev"
                echo "SEED_AFTER_MIGRATE=true"
                echo "PUBLIC_HEALTH_URL=https://api-dev-colokin.albern.space/v1/health"
              } >> "$GITHUB_ENV"
              ;;
            prod)
              {
                echo "DEPLOY_ENV=prod"
                echo "DEPLOY_PATH=/home/froztbitez/web-server/colokin/prod"
                echo "ENV_FILE=.env.server.prod"
                echo "SEED_AFTER_MIGRATE=false"
                echo "PUBLIC_HEALTH_URL=https://api-colokin.albern.space/v1/health"
              } >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unknown deploy target: $target" >&2
              exit 1
              ;;
          esac

      - name: Sync deployment files
        run: |
          case "$DEPLOY_PATH" in
            /home/froztbitez/web-server/colokin/dev|/home/froztbitez/web-server/colokin/prod) ;;
            *)
              echo "Refusing to sync unexpected DEPLOY_PATH: $DEPLOY_PATH" >&2
              exit 1
              ;;
          esac

          mkdir -p "$DEPLOY_PATH"
          find "$DEPLOY_PATH" -mindepth 1 \
            ! -name '.env.server.dev' \
            ! -name '.env.server.prod' \
            ! -name 'backups' \
            ! -path "$DEPLOY_PATH/backups/*" \
            -exec rm -rf {} +

          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='coverage' \
            --exclude='.turbo' \
            --exclude='.expo' \
            --exclude='.env' \
            --exclude='.env.*' \
            -czf /tmp/colokin-release.tgz .
          tar -xzf /tmp/colokin-release.tgz -C "$DEPLOY_PATH"
          rm /tmp/colokin-release.tgz

          if [ ! -f "$DEPLOY_PATH/$ENV_FILE" ]; then
            echo "Missing $DEPLOY_PATH/$ENV_FILE. Copy the matching example file and fill secrets on the server." >&2
            exit 1
          fi

      - name: Build and deploy stack
        env:
          API_IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$DEPLOY_PATH"
          set -a
          . "$ENV_FILE"
          set +a
          export API_IMAGE

          docker compose --env-file "$ENV_FILE" -f docker-compose.server.yml config >/dev/null
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker compose --env-file "$ENV_FILE" -f docker-compose.server.yml pull api
          docker compose --env-file "$ENV_FILE" -f docker-compose.server.yml up -d --wait postgres mosquitto

          mkdir -p backups
          docker compose --env-file "$ENV_FILE" -f docker-compose.server.yml exec -T postgres \
            sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
            > "backups/predeploy-${DEPLOY_ENV}-$(date +%Y%m%d%H%M%S).sql"

          docker compose --env-file "$ENV_FILE" -f docker-compose.server.yml run --rm migrate

          if [ "$SEED_AFTER_MIGRATE" = "true" ]; then
            docker compose --env-file "$ENV_FILE" -f docker-compose.server.yml run --rm seed
          fi

          docker compose --env-file "$ENV_FILE" -f docker-compose.server.yml up -d --wait api
          docker image prune -f

      - name: Smoke test
        env:
          API_IMAGE: ${{ needs.build.outputs.image }}
        run: |
          cd "$DEPLOY_PATH"
          set -a
          . "$ENV_FILE"
          set +a
          export API_IMAGE

          curl --fail --show-error --silent "http://127.0.0.1:${API_HOST_PORT}/v1/health"
          curl --fail --show-error --silent "$PUBLIC_HEALTH_URL"
