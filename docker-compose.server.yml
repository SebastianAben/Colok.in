name: ${COMPOSE_PROJECT_NAME:-colokin}

x-api-environment: &api-environment
  NODE_ENV: production
  API_PORT: 4000
  DATABASE_URL: postgresql://${POSTGRES_USER:-colokin}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-colokin}?schema=public
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
  MQTT_URL: mqtt://mosquitto:1883
  IOT_MODE: ${IOT_MODE:-mock}
  FCM_ENABLED: ${FCM_ENABLED:-false}
  FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
  FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
  FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
  PUBLIC_API_URL: ${PUBLIC_API_URL:-}

services:
  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    restart: unless-stopped
    environment:
      <<: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    ports:
      - "${API_HOST_BIND:-127.0.0.1}:${API_HOST_PORT:-4000}:4000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:4000/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    image: ${API_IMAGE:?API_IMAGE is required}
    restart: "no"
    environment:
      <<: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    command: pnpm prisma:migrate:deploy
    profiles:
      - tools

  seed:
    image: ${API_IMAGE:?API_IMAGE is required}
    restart: "no"
    environment:
      <<: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    command: pnpm prisma:seed
    profiles:
      - tools

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-colokin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-colokin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-colokin} -d ${POSTGRES_DB:-colokin}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  postgres_data:
